# =====================================================================
# CI: Build & Docker Image — 综合小区管理系统
# =====================================================================
# Nginx reverse proxy configuration (for deployment reference):
#
#   server {
#       listen 80;
#       server_name your-domain.com;
#
#       location /zonghexiaoqiguanlixitong/ {
#           proxy_pass http://127.0.0.1:8080/zonghexiaoqiguanlixitong/;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           client_max_body_size 1000m;
#       }
#   }
#
# Frontend baseURL configuration:
#   - admin/admin/src/utils/http.js  →  baseURL: '/zonghexiaoqiguanlixitong'
#   - front/front/modules/http/http.js  →  baseurl = "/zonghexiaoqiguanlixitong/"
#   Both use RELATIVE paths (no hostname), so they automatically follow
#   whatever domain/IP nginx exposes. No code changes needed per environment.
#   If you change server.servlet.context-path, update both files and rebuild
#   the Vue admin dist (npm run build in admin/admin/).
# =====================================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Maven Build & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zonghexiaoqiguanlixitong
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Maven verify (prod profile, includes frontend build)
        run: mvn verify -Pprod -B

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t xiaoqu-app:${{ github.sha }} ./zonghexiaoqiguanlixitong
          docker tag xiaoqu-app:${{ github.sha }} xiaoqu-app:latest

