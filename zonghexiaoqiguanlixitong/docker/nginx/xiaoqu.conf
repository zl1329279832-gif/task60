# ============================================================
# Nginx 反向代理配置示例
# 将此文件放到公司 Nginx 的 conf.d/ 下, 或合并到已有配置中
# ============================================================
#
# 部署拓扑:
#   浏览器 --> Nginx (80/443)
#              ├── /zonghexiaoqiguanlixitong/  -->  app:8080
#              └── 静态资源缓存
#
# 如果使用 docker-compose 自带的 app 端口直连, 也可以不用 Nginx.
# 但生产环境建议 Nginx 反代, 便于 HTTPS / 静态缓存 / 日志.
# ============================================================

upstream xiaoqu_backend {
    server 127.0.0.1:8080;   # Docker 容器映射到宿主机 8080
    keepalive 32;
}

server {
    listen       80;
    server_name  your-domain.com;   # ← 改成实际域名

    # 如果需要 HTTPS, 取消注释:
    # listen       443 ssl;
    # ssl_certificate     /etc/nginx/ssl/your-domain.pem;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.key;

    client_max_body_size 1000m;   # 与 Spring multipart 限制一致

    # ---------- 小区管理系统 ----------
    location /zonghexiaoqiguanlixitong/ {
        proxy_pass         http://xiaoqu_backend/zonghexiaoqiguanlixitong/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 大文件上传超时
        proxy_connect_timeout  300s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
    }

    # ---------- 静态资源缓存 (可选) ----------
    location ~* ^/zonghexiaoqiguanlixitong/(admin|front|static)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass         http://xiaoqu_backend;
        proxy_set_header   Host              $host;
        expires            7d;
        add_header         Cache-Control     "public, immutable";
    }
}
